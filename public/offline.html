<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e9">
  <title>NutriCart · Offline</title>
  <style>
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f1e9; color: #28332d; font-family: Arial, Helvetica, sans-serif; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { margin: 22px 0 8px; color: #21513e; font-size: 30px; letter-spacing: -.04em; }
    p { max-width: 300px; margin: 0 auto 26px; color: #7c8175; line-height: 1.5; }
    button { border: 0; border-radius: 12px; background: #21513e; color: #f8f5ed; padding: 15px 26px; font: inherit; font-weight: 700; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You’re offline</h1>
    <p>NutriCart needs a connection to look up products. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
